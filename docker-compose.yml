version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: vibetracker-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret #твой пароль от юзера postgres
      POSTGRES_DB: vibetracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: